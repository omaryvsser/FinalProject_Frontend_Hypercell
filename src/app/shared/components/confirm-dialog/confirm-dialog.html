<div class="confirm-dialog-container" [ngClass]="data.type || 'danger'">
  <div class="dialog-header">
    <div class="icon-circle" [ngClass]="data.type || 'danger'">
      <mat-icon>
        @switch (data.type) {
          @case ('info') { info }
          @case ('warning') { warning }
          @default { delete_forever }
        }
      </mat-icon>
    </div>
    <h2 mat-dialog-title class="dialog-title">{{ data.title }}</h2>
  </div>

  <mat-dialog-content class="dialog-content">
    <p class="dialog-message">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button type="button" class="btn-cancel" (click)="onCancel()">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button
      mat-flat-button
      type="button"
      class="btn-confirm"
      [ngClass]="data.type || 'danger'"
      (click)="onConfirm()"
    >
      {{ data.confirmText || 'Confirm' }}
    </button>
  </mat-dialog-actions>
</div>
