<div class="not-found-container">
  <div class="not-found-card">
    <div class="icon-badge">
      <span class="material-symbols-outlined not-found-icon">error_outline</span>
    </div>

    <h1 class="error-code">404</h1>
    <h2 class="error-title">Page Not Found</h2>
    <p class="error-description">
      Oops! The page you are looking for doesn't exist, was removed, or an unexpected error occurred.
    </p>

    <div class="action-buttons">
      <a routerLink="/" class="btn-primary">
        <span class="material-symbols-outlined btn-icon">home</span>
        Back to Home
      </a>

      <a routerLink="/admin" class="btn-secondary">
        <span class="material-symbols-outlined btn-icon">dashboard</span>
        Go to Admin Portal
      </a>
    </div>
  </div>
</div>
