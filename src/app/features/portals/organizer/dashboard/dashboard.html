<div class="organizer-dashboard">
  <!-- Top Navigation & Branding Header -->
  <app-organizer-header [organizerEmail]="organizerEmail()"></app-organizer-header>

  <!-- Metric Overview Cards Grid -->
  <app-organizer-metric-cards
    [totalMovies]="totalMovies()"
    [publishedMovies]="publishedMovies()"
    [totalBookings]="totalBookings()"
    [totalAttendees]="totalAttendees()"
  ></app-organizer-metric-cards>

  <!-- Content Workspace Panel -->
  <section class="workspace-panel">
    <!-- Controls Row: Tabs & Action Button -->
    <app-organizer-tabs
      [activeTab]="activeTab()"
      [allCount]="totalMovies()"
      [publishedCount]="publishedMovies()"
      [draftCount]="draftMovies()"
      [completedCount]="completedMovies()"
      (tabChange)="setActiveTab($event)"
      (addClick)="openAddDrawer()"
    ></app-organizer-tabs>

    <!-- Data Table Container & Pagination -->
    <app-organizer-table
      [movies]="paginatedMovies()"
      [totalItems]="filteredMovies().length"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [pagesArray]="pagesArray()"
      (editMovie)="openEditDrawer($event)"
      (deleteMovie)="deleteMovie($event)"
      (viewAttendees)="viewAttendees($event)"
      (pageChange)="goToPage($event)"
    ></app-organizer-table>
  </section>

  <!-- Slide-Over Right Drawer Component -->
  <app-organizer-slide-over-drawer
    [isOpen]="isDrawerOpen()"
    [selectedMovie]="selectedMovie()"
    [venues]="venues()"
    [(formTitle)]="formTitle"
    [(formImageUrl)]="formImageUrl"
    [(formCategory)]="formCategory"
    [(formVenueId)]="formVenueId"
    [(formStartDate)]="formStartDate"
    [(formStatus)]="formStatus"
    (closeDrawer)="closeDrawer()"
    (saveMovie)="saveDrawerMovie()"
  >
  </app-organizer-slide-over-drawer>
</div>
