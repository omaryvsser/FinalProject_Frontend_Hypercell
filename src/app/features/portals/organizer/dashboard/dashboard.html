<div class="organizer-dashboard">
  <!-- Top Navigation & Branding Header -->
  <app-organizer-header [organizerEmail]="organizerEmail()"></app-organizer-header>

  <!-- Metric Overview Cards Grid -->
  <app-organizer-metric-cards
    [totalMovies]="totalMovies()"
    [publishedMovies]="publishedMovies()"
    [totalBookings]="totalBookings()"
    [totalAttendees]="totalAttendees()"
  ></app-organizer-metric-cards>

  <!-- Content Workspace Panel -->
  <section class="workspace-panel">
    <!-- Controls Row: Tabs & Action Button -->
    <app-organizer-tabs
      [activeTab]="activeTab()"
      [allCount]="totalMovies()"
      [publishedCount]="publishedMovies()"
      [draftCount]="draftMovies()"
      [completedCount]="completedMovies()"
      (tabChange)="setActiveTab($event)"
      (addClick)="openAddDrawer()"
    ></app-organizer-tabs>

    <!-- Reusable Table Container & Pagination -->
    <app-admin-table
      [data]="paginatedMovies()"
      [columns]="tableColumns"
      [actions]="tableActions"
      emptyMessage="No organizer movies found."
      emptyIcon="movie_off"
      [totalItems]="filteredMovies().length"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [pagesArray]="pagesArray()"
      (actionClick)="handleTableAction($event)"
      (edit)="openEditDrawer($event)"
      (delete)="deleteMovie($event)"
      (pageChange)="goToPage($event)"
    ></app-admin-table>
  </section>

  <!-- Dynamic Shared Drawer Component with Configuration Map -->
  <app-drawer
    [isOpen]="isDrawerOpen()"
    [title]="activeDrawerConfig()?.title || ''"
    [subtitle]="activeDrawerConfig()?.subtitle || ''"
    [wide]="activeDrawerConfig()?.wide || true"
    (close)="closeDrawer()"
  >
    @if (activeDrawerConfig(); as config) {
      <form class="drawer-form" (submit)="$event.preventDefault(); saveDrawerMovie()">
        <ng-container
          *ngComponentOutlet="config.component; inputs: config.inputs"
        ></ng-container>

        <footer class="drawer-footer">
          <button type="button" class="btn-cancel" (click)="closeDrawer()">
            Cancel
          </button>
          <button type="button" class="btn-save" (click)="saveDrawerMovie()">
            <span class="material-symbols-outlined btn-save-icon">save</span>
            {{ config.submitLabel }}
          </button>
        </footer>
      </form>
    }
  </app-drawer>
</div>
