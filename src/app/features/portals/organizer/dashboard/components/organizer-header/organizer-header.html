<header class="dashboard-header">
  <div class="header-branding">
    <div class="brand-badge">
      <span class="material-symbols-outlined brand-icon">theaters</span>
    </div>
    <div>
      <h1 class="dashboard-title">Organizer Portal</h1>
      <p class="dashboard-subtitle">Manage your movies, showtimes, bookings, and attendees.</p>
    </div>
  </div>

  <div class="organizer-profile">
    <div class="profile-info">
      <span class="profile-name">Organizer Account</span>
      <span class="profile-email">{{ organizerEmail() }}</span>
    </div>
    <div class="profile-avatar">
      <span class="material-symbols-outlined avatar-icon">badge</span>
    </div>
  </div>
</header>
