<section class="attendees-page">
  <header class="attendees-header">
    <div>
      <p class="attendees-label">Organizer Portal</p>
      <h1>Bookings and Attendees</h1>

      <p class="attendees-description">
        {{ movieTitle() }}
      </p>
    </div>

    <a mat-button routerLink="/organizer">
      <mat-icon>arrow_back</mat-icon>
      Dashboard
    </a>
  </header>

  <div class="booking-summary" aria-label="Booking summary">
    <mat-card appearance="outlined">
      <mat-card-content>
        <span class="summary-value">{{ totalBookings() }}</span>
        <span class="summary-label">Bookings</span>
      </mat-card-content>
    </mat-card>

    <mat-card appearance="outlined">
      <mat-card-content>
        <span class="summary-value">{{ totalTickets() }}</span>
        <span class="summary-label">Tickets Sold</span>
      </mat-card-content>
    </mat-card>

    <mat-card appearance="outlined">
      <mat-card-content>
        <span class="summary-value">
          {{ totalRevenue() | currency: 'EGP':'code':'1.0-2' }}
        </span>
        <span class="summary-label">Revenue</span>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-card class="bookings-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Attendee Bookings</mat-card-title>
      <mat-card-subtitle>
        Booking records for this movie
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <app-data-table
        [data]="bookings()"
        [columns]="tableColumns"
        [totalItems]="bookings().length"
        [showPagination]="false"
        emptyMessage="No bookings yet. This movie has not received any bookings."
        emptyIcon="confirmation_number"
      ></app-data-table>
    </mat-card-content>
  </mat-card>
</section>
