<div class="admin-dashboard">
  <!-- Top Navigation & Branding Header -->
  <app-admin-header [currentUserEmail]="currentUserEmail()"></app-admin-header>

  <!-- Metric Overview Cards Grid -->
  <app-metric-cards
    [totalUsersCount]="totalUsersCount()"
    [activeOrganizersCount]="totalOrganizersCount()"
    [registeredVenuesCount]="totalVenuesCount()"
    [totalMoviesCount]="totalMoviesCount()"
  ></app-metric-cards>

  <!-- Content Workspace Panel -->
  <section class="workspace-panel">
    <!-- Controls Row: Tabs & Action Button -->
    <app-admin-tabs
      [activeTab]="activeTab()"
      [usersCount]="totalUsersCount()"
      [organizersCount]="totalOrganizersCount()"
      [venuesCount]="totalVenuesCount()"
      [moviesCount]="totalMoviesCount()"
      [bookingsCount]="totalBookingsCount()"
      [singularTabLabel]="singularTabLabel()"
      (tabChange)="setActiveTab($event)"
      (addClick)="openAddDrawer()"
    ></app-admin-tabs>

    <!-- Reusable Admin Table Container & Pagination -->
    <app-admin-table
      [data]="currentTableData()"
      [columns]="tableColumns()"
      [actions]="tableActions()"
      [currentUserEmail]="currentUserEmail()"
      [emptyMessage]="'No ' + activeTab().toLowerCase() + ' items found.'"
      [totalItems]="totalItems()"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [pagesArray]="pagesArray()"
      [pageSize]="pageSize()"
      (edit)="openEditDrawer($event)"
      (delete)="deleteItem($event)"
      (actionClick)="handleTableAction($event)"
      (roleChange)="updateUserRole($event.row, $event.newRole)"
      (statusChange)="updateBookingStatus($event.row, $event.newStatus)"
      (pageChange)="goToPage($event)"
    ></app-admin-table>
  </section>


  <!-- Dynamic Shared Drawer Component with Configuration Map -->
  <app-drawer
    [isOpen]="isDrawerOpen()"
    [title]="activeDrawerConfig()?.title || ''"
    [subtitle]="activeDrawerConfig()?.subtitle || ''"
    [wide]="activeDrawerConfig()?.wide || false"
    (close)="closeDrawer()"
  >
    @if (isDrawerOpen() && activeDrawerConfig(); as config) {
      <form class="drawer-form" (submit)="$event.preventDefault(); saveDrawerItem()">
        <ng-container
          *ngComponentOutlet="config.component; inputs: config.inputs"
        ></ng-container>

        <footer class="drawer-footer">
          <button type="button" class="btn-cancel" (click)="closeDrawer()">
            Cancel
          </button>
          <button type="button" class="btn-save" (click)="saveDrawerItem()">
            <span class="material-symbols-outlined btn-save-icon">save</span>
            {{ config.submitLabel }}
          </button>
        </footer>
      </form>
    }
  </app-drawer>
</div>
